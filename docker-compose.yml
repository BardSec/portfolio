services:
  portfolio:
    build: .
    ports:
      - "3000:3000"
    volumes:
      # Persist the SQLite database and uploaded images across restarts
      - portfolio_data:/app/data
      - portfolio_uploads:/app/uploads
    environment:
      # Change these before deploying!
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: changeme
      JWT_SECRET: replace-with-a-long-random-string
      PORT: 3000
    restart: unless-stopped

volumes:
  portfolio_data:
  portfolio_uploads:

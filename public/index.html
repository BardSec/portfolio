<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="site-title">My Projects</h1>
      <p class="site-subtitle">A collection of things I've built and written about</p>
    </div>
  </header>

  <main class="container">
    <div id="loading" class="loading-state">
      <div class="spinner"></div>
      <p>Loading projects…</p>
    </div>

    <div id="empty" class="empty-state" hidden>
      <p>No projects yet. Check back soon!</p>
    </div>

    <div id="project-grid" class="project-grid" hidden></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a href="/admin" class="admin-link">Admin</a>
    </div>
  </footer>

  <!-- Card template -->
  <template id="card-template">
    <article class="card">
      <div class="card-thumbnail">
        <img src="" alt="" loading="lazy" />
        <div class="card-thumbnail-placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
        </div>
      </div>
      <div class="card-body">
        <h2 class="card-title"></h2>
        <p class="card-description"></p>
        <div class="card-links">
          <a class="btn btn-primary demo-link" target="_blank" rel="noopener noreferrer">Live Demo</a>
          <a class="btn btn-secondary blog-link" target="_blank" rel="noopener noreferrer">Blog Post</a>
        </div>
      </div>
    </article>
  </template>

  <script src="/js/main.js"></script>
</body>
</html>
